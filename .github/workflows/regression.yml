name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check javascript/krea2_backgrounds.js
      - run: node --test tests/regression.test.cjs
      - name: Chromium fixture
        run: CHROME_BIN="$(command -v google-chrome)" node tests/browser.cjs
